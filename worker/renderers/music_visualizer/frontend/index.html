<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════
//  Music Visualizer — Modular WebGL2 Engine v3
//  Separação de bandas: Bass / Mid / High / Beat
//  Movimento orgânico contínuo em todos os módulos
// ═══════════════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
let gl = canvas.getContext('webgl2',{alpha:false,antialias:true,preserveDrawingBuffer:true,premultipliedAlpha:false});
if(!gl) gl=canvas.getContext('webgl',{preserveDrawingBuffer:true,antialias:true});

// ── State ─────────────────────────────────────────────────────────
let W=1920,H=1080,FPS=30,CFG={};
let PROJ;
let DOM_COLOR=[0.3,0.5,1.0]; // dominant color
let T=0; // global time accumulator

// ── Audio bands (per-frame, updated in renderFrame) ───────────────
const BANDS={bass:0,mid:0,high:0,presence:0,rms:0,beat:false,beatStr:0,
             bassSmooth:0,midSmooth:0,highSmooth:0,presSmooth:0,rmsSmooth:0};

// ── Module instances ──────────────────────────────────────────────
let mBG, mHalo, mWaves, mSpectrum, mParticles, mCircle, mLens, mHUD;

// ─────────────────────────────────────────────────────────────────
//  GL helpers
// ─────────────────────────────────────────────────────────────────
function mkProg(vs,fs){
  const p=gl.createProgram();
  [vs,fs].forEach((src,i)=>{
    const s=gl.createShader(i?gl.FRAGMENT_SHADER:gl.VERTEX_SHADER);
    gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))
      console.error('Shader error:',gl.getShaderInfoLog(s));
    gl.attachShader(p,s);
  });
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))
    console.error('Link error:',gl.getProgramInfoLog(p));
  return p;
}
function ortho(w,h){return[2/w,0,0,0,-2/h,0,-1,1,1];}
function hexRGB(h){
  h=h.replace('#','');if(h.length<6)h=h+h;
  return[parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255];
}
function hexRGBA(h,a=1){const c=hexRGB(h);return[...c,a];}
function loadTex(src){
  return new Promise(r=>{
    const i=new Image();
    i.onload=()=>{
      const t=gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D,t);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,i);
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      r({tex:t,w:i.width,h:i.height});
    };
    i.onerror=()=>r(null);
    i.src=src;
  });
}
// Create a Float32Array from positions+uvs for a screen quad
function quadVerts(x,y,w,h){
  return new Float32Array([x,y,0,0, x+w,y,1,0, x,y+h,0,1, x+w,y+h,1,1]);
}
let _dynBufs={};
function db(key){if(!_dynBufs[key])_dynBufs[key]=gl.createBuffer();return _dynBufs[key];}
function up(buf,data,usage=35048){gl.bindBuffer(34962,buf);gl.bufferData(34962,data,usage);}
function att(prog,name,sz,stride,off){
  const l=gl.getAttribLocation(prog,name);
  if(l<0)return;gl.enableVertexAttribArray(l);
  gl.vertexAttribPointer(l,sz,gl.FLOAT,false,stride,off);
}
function u1f(p,n,v){gl.uniform1f(gl.getUniformLocation(p,n),v);}
function u2f(p,n,x,y){gl.uniform2f(gl.getUniformLocation(p,n),x,y);}
function u4f(p,n,r,g,b,a){gl.uniform4f(gl.getUniformLocation(p,n),r,g,b,a);}
function uM(p,n,m){gl.uniformMatrix3fv(gl.getUniformLocation(p,n),false,m);}
function u1i(p,n,v){gl.uniform1i(gl.getUniformLocation(p,n),v);}
function bNorm(){gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);}
function bAdd(){gl.blendFunc(gl.SRC_ALPHA,gl.ONE);}

function makeTex2D(cv){
  const t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return t;
}
function textTex(text,fontSize,color,shadow,maxW){
  const cv=document.createElement('canvas');
  const ct=cv.getContext('2d');
  ct.font=`bold ${fontSize}px Arial`;
  const tw=Math.min(Math.ceil(ct.measureText(text).width)+fontSize,maxW||W-80);
  const th=Math.ceil(fontSize*1.9);
  cv.width=tw;cv.height=th;
  ct.font=`bold ${fontSize}px Arial`;ct.textBaseline='middle';
  ct.fillStyle=shadow||'rgba(0,0,0,0.85)';ct.fillText(text,3,th/2+3);
  ct.fillStyle=color||'#fff';ct.fillText(text,0,th/2);
  return{tex:makeTex2D(cv),w:tw,h:th};
}
function initialsTex(text,sz,color){
  const cv=document.createElement('canvas');
  const s=Math.ceil(sz*2.6);cv.width=cv.height=s;
  const ct=cv.getContext('2d');
  ct.font=`bold ${sz}px Arial`;ct.textAlign='center';ct.textBaseline='middle';
  ct.shadowColor='rgba(255,255,255,0.5)';ct.shadowBlur=sz*0.5;
  ct.fillStyle=color||'#fff';ct.fillText(text,s/2,s/2);
  return{tex:makeTex2D(cv),w:s,h:s};
}

// circle fan buffer
function fanBuf(n=256){
  const v=[0,0];
  for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;v.push(Math.cos(a),Math.sin(a));}
  const b=gl.createBuffer();up(b,new Float32Array(v),35044);return{buf:b,n:v.length/2};
}
function ringBuf(n=512){
  const v=[];
  for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;v.push(Math.cos(a),Math.sin(a));}
  const b=gl.createBuffer();up(b,new Float32Array(v),35044);return{buf:b,n:v.length/2};
}

// Perlin-like smooth noise
function noise(t){return Math.sin(t*1.3)*Math.cos(t*0.7)*Math.sin(t*2.1+0.4)*0.5+0.5;}
function snoise(t){return Math.sin(t*1.1)*0.5+Math.cos(t*2.3)*0.3+Math.sin(t*0.4)*0.2;}

// Dominant color extractor
function extractDomColor(src){
  return new Promise(r=>{
    const i=new Image();
    i.onload=()=>{
      const cv=document.createElement('canvas');cv.width=cv.height=12;
      const ct=cv.getContext('2d');ct.drawImage(i,0,0,12,12);
      const d=ct.getImageData(0,0,12,12).data;
      let rr=0,gg=0,bb=0,cnt=0;
      for(let j=0;j<d.length;j+=4){
        const L=d[j]*.3+d[j+1]*.59+d[j+2]*.11;
        if(L>25&&L<240){rr+=d[j];gg+=d[j+1];bb+=d[j+2];cnt++;}
      }
      if(!cnt){r([0.3,0.5,1.0]);return;}
      const rv=rr/cnt/255,gv=gg/cnt/255,bv=bb/cnt/255;
      const mx=Math.max(rv,gv,bv),mn=Math.min(rv,gv,bv);
      if(mx-mn<0.12){r([0.3,0.5,1.0]);return;}
      // Boost saturation
      const boost=(c,m)=>Math.min(1,m+(c-m)*1.8);
      r([boost(rv,(rv+gv+bv)/3),boost(gv,(rv+gv+bv)/3),boost(bv,(rv+gv+bv)/3)]);
    };
    i.onerror=()=>r([0.3,0.5,1.0]);
    i.src=src;
  });
}

// Split spectrum into bands (indices into spectrum array of length N)
function bandEnergy(spectrum,loFrac,hiFrac){
  const N=spectrum.length;
  const lo=Math.floor(loFrac*N),hi=Math.ceil(hiFrac*N);
  let s=0;const cnt=hi-lo;
  for(let i=lo;i<hi;i++)s+=spectrum[i]||0;
  return cnt>0?s/cnt:0;
}
</script>

<script>
// ═══════════════════════════════════════════════════════════════════
//  BackgroundModule — always alive, never static
//  bass → brightness pulse  |  mid → parallax  |  high → grain
//  continuous: zoom, rotation, horizontal drift
// ═══════════════════════════════════════════════════════════════════
class BackgroundModule {
  constructor(){
    this.tex=null;
    this.bright=0; this.vig=0.42;
    this.shX=0; this.shY=0;
    this._p=mkProg(
      `#version 300 es
       in vec2 a_p,a_uv; uniform mat3 u_m; out vec2 v_uv;
       void main(){gl_Position=vec4((u_m*vec3(a_p,1.)).xy,0.,1.);v_uv=a_uv;}`,
      `#version 300 es
       precision highp float;
       in vec2 v_uv; uniform sampler2D u_t;
       uniform float u_br,u_vig,u_ca,u_grain,u_time;
       out vec4 o;
       float rnd(vec2 co){return fract(sin(dot(co,vec2(12.9898,78.233)))*43758.5453);}
       void main(){
         vec2 uv=v_uv;
         float r=texture(u_t,uv+vec2(u_ca,0.)).r;
         float g=texture(u_t,uv).g;
         float b=texture(u_t,uv-vec2(u_ca,0.)).b;
         vec4 c=vec4(r,g,b,1.);
         // brightness + contrast boost
         c.rgb=((c.rgb-0.5)*(1.0+u_br*0.5)+0.5)+u_br*0.15;
         c.rgb=clamp(c.rgb,0.,1.);
         // vignette
         vec2 vc=(v_uv-0.5)*2.;
         float vg=clamp(pow(1.-dot(vc*.65,vc*.65),1.5),0.,1.);
         c.rgb*=mix(1.-u_vig,1.,vg);
         // film grain
         c.rgb+=rnd(uv*3.+u_time)*(u_grain*0.05)-u_grain*0.025;
         o=c;
       }`);
    this._buf=gl.createBuffer();
  }
  async init(src){const r=await loadTex(src);this.tex=r&&r.tex;}
  update(dt){
    const cfg=CFG, b=BANDS;
    // shake on beat (bass driven)
    if(b.beat){
      const sp=(cfg.bg_beat_shake_px||7)*b.bassSmooth;
      this.shX=(Math.random()-.5)*sp*2.2;
      this.shY=(Math.random()-.5)*sp*1.5;
    } else {this.shX*=0.50;this.shY*=0.50;}
    // brightness: bass controls main pulse, always some ambient
    const tBr=b.bassSmooth*(cfg.bg_brightness_boost||0.30)*1.5+b.rmsSmooth*0.04;
    this.bright+=(tBr-this.bright)*0.14;
    // vignette: opens on beat
    const tVig=(cfg.vignette_strength||0.42)-b.bassSmooth*0.18;
    this.vig+=(tVig-this.vig)*0.08;
  }
  draw(){
    if(!this.tex)return;
    const cfg=CFG;
    // Ken Burns: continuous slow zoom (0→8% over full duration)
    const zoom=1.0+Math.min(T/300,1)*0.08+0.02;
    const margin=(zoom-1)/2+0.02;
    // Horizontal drift (mid band) + camera shake
    const drift=Math.sin(T*0.07)*0.008+this.shX/W*0.5;
    const vdrift=Math.sin(T*0.05)*0.004+this.shY/H*0.5;
    // Parallax offset from mid frequencies
    const px=BANDS.midSmooth*0.012*Math.sin(T*0.11);
    const py=BANDS.midSmooth*0.008*Math.cos(T*0.09);
    const verts=new Float32Array([
      0,0, margin+drift+px,    margin+vdrift+py,
      W,0, 1-margin+drift+px,  margin+vdrift+py,
      0,H, margin+drift+px,    1-margin+vdrift+py,
      W,H, 1-margin+drift+px,  1-margin+vdrift+py,
    ]);
    gl.useProgram(this._p);
    up(this._buf,verts);
    att(this._p,'a_p',2,16,0);att(this._p,'a_uv',2,16,8);
    uM(this._p,'u_m',PROJ);u1i(this._p,'u_t',0);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,this.tex);
    u1f(this._p,'u_br',this.bright);
    u1f(this._p,'u_vig',Math.max(0,this.vig));
    u1f(this._p,'u_ca',(cfg.chromatic_aberration||0.0008)*(1+this.bright*2.5));
    u1f(this._p,'u_grain',cfg.film_grain||0.5);
    u1f(this._p,'u_time',T*10);
    bNorm();gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
}
</script>

<script>
// ═══════════════════════════════════════════════════════════════════
//  HaloModule — diffuse light BEHIND the circle
//  bass → size  |  mid → intensity  |  continuously breathing
// ═══════════════════════════════════════════════════════════════════
class HaloModule {
  constructor(){
    this.r=0; this.glow=0;
    const {buf,n}=fanBuf(128);this._fb=buf;this._fn=n;
    this._p=mkProg(
      `#version 300 es
       in vec2 a_p;uniform vec2 u_cen;uniform float u_r;uniform mat3 u_m;
       out vec2 v_l;
       void main(){v_l=a_p;gl_Position=vec4((u_m*vec3(u_cen+a_p*u_r,1.)).xy,0.,1.);}`,
      `#version 300 es
       precision highp float;
       in vec2 v_l;uniform vec4 u_col;out vec4 o;
       void main(){
         float d=length(v_l);if(d>1.)discard;
         float g=pow(1.-d,2.5);
         o=vec4(u_col.rgb,g*u_col.a);
       }`);
  }
  update(dt){
    const b=BANDS;
    // Bass drives radius, mid drives intensity — they're independent
    const baseR=(CFG.circle_radius||200);
    const tR=baseR*(2.8+b.bassSmooth*1.8);
    this.r+=(tR-this.r)*0.08;
    const tG=0.12+b.midSmooth*0.35+b.bassSmooth*0.25
             +0.06*Math.sin(T*1.2)*Math.cos(T*0.7); // organic breathing
    this.glow+=(tG-this.glow)*0.10;
  }
  draw(cx,cy){
    if(this.glow<0.01)return;
    gl.useProgram(this._p);
    gl.bindBuffer(gl.ARRAY_BUFFER,this._fb);
    att(this._p,'a_p',2,8,0);
    uM(this._p,'u_m',PROJ);u2f(this._p,'u_cen',cx,cy);
    const dc=DOM_COLOR;
    bAdd();
    for(let l=0;l<4;l++){
      const lr=this.r*(1+l*0.3);
      const la=this.glow*(0.22-l*0.05);
      gl.uniform1f(gl.getUniformLocation(this._p,'u_r'),lr);
      u4f(this._p,'u_col',dc[0],dc[1],dc[2],la);
      gl.drawArrays(gl.TRIANGLE_FAN,0,this._fn);
    }
    bNorm();
  }
}

// ═══════════════════════════════════════════════════════════════════
//  WaveRings — mid/vocal frequencies, organic expansion
// ═══════════════════════════════════════════════════════════════════
class WaveRings {
  constructor(){
    this.waves=[];
    const {buf,n}=ringBuf(512);this._rb=buf;this._rn=n;
    this._p=mkProg(
      `#version 300 es
       in vec2 a_p;uniform vec2 u_cen;uniform float u_r;uniform mat3 u_m;
       void main(){gl_Position=vec4((u_m*vec3(u_cen+a_p*u_r,1.)).xy,0.,1.);}`,
      `#version 300 es
       precision highp float;uniform vec4 u_col;out vec4 o;void main(){o=u_col;}`);
  }
  onBeat(){
    // mid-band controls intensity of waves
    this.waves.push({str:Math.min(1,BANDS.midSmooth*1.4+BANDS.bassSmooth*0.6+0.25),age:0});
  }
  update(dt){this.waves=this.waves.filter(w=>{w.age+=dt*0.75;return w.age<1;});}
  draw(cx,cy,baseR){
    if(!CFG.waves_enabled||!this.waves.length)return;
    gl.useProgram(this._p);
    gl.bindBuffer(gl.ARRAY_BUFFER,this._rb);att(this._p,'a_p',2,8,0);
    uM(this._p,'u_m',PROJ);u2f(this._p,'u_cen',cx,cy);
    const dc=DOM_COLOR;
    const wc=CFG.wave_color==='auto'?dc:hexRGB(CFG.wave_color||'#fff');
    const mo=CFG.wave_opacity_max||0.8;
    bAdd();
    for(const w of this.waves){
      const r=baseR*(1+w.age*3.0);
      const a=(1-w.age)*mo*w.str;
      for(let t=0;t<3;t++){
        gl.uniform1f(gl.getUniformLocation(this._p,'u_r'),r+t*2.5);
        u4f(this._p,'u_col',wc[0],wc[1],wc[2],a*(1-t*0.35));
        gl.drawArrays(gl.LINE_STRIP,0,this._rn);
      }
    }
    bNorm();
  }
}
</script>

<script>
// ═══════════════════════════════════════════════════════════════════
//  AudioSpectrum — 512 bars, variable thickness, glowing tips
//  high freq → more color  |  interpolated per frame
// ═══════════════════════════════════════════════════════════════════
class AudioSpectrum {
  constructor(){
    this._prev=null;
    this._p=mkProg(
      `#version 300 es
       in vec2 a_p;in float a_br;uniform mat3 u_m;out float v_br;
       void main(){gl_Position=vec4((u_m*vec3(a_p,1.)).xy,0.,1.);v_br=a_br;}`,
      `#version 300 es
       precision highp float;
       in float v_br;uniform vec4 u_col,u_tip;out vec4 o;
       void main(){
         vec4 c=mix(u_col,u_tip,smoothstep(0.5,1.0,v_br));
         c.a*=v_br*0.85+0.15;
         o=c;
       }`);
    this._vb=gl.createBuffer();this._bb=gl.createBuffer();
  }
  draw(cx,cy,circleR,spectrum){
    if(!spectrum||!spectrum.length)return;
    const cfg=CFG;
    const N=spectrum.length;
    if(!this._prev||this._prev.length!==N)this._prev=new Float32Array(N);
    const alpha=0.28;
    const vals=new Float32Array(N);
    for(let i=0;i<N;i++){
      this._prev[i]+=(( spectrum[i]||0)-this._prev[i])*alpha;
      vals[i]=this._prev[i];
    }
    const rOff=CFG.spectrum_radius_offset||22;
    const innerR=circleR+rOff;
    // Beat boost — bars jump higher on strong hits
    const boost=1.0+BANDS.bassSmooth*(CFG.spectrum_beat_boost||0.55)
                   +BANDS.rmsSmooth*0.18;
    const maxH=(CFG.spectrum_max_height||220)*boost;
    // Angular slot per bar — must cover the FULL circle (2π/N)
    const slot=(Math.PI*2)/N;
    const fill=CFG.spectrum_fill||0.82; // 82% of slot = thin gap between bars
    const verts=new Float32Array(N*12);
    const brights=new Float32Array(N*6);
    let vi=0,bi=0;
    for(let i=0;i<N;i++){
      const ang=(i/N*Math.PI*2)-Math.PI/2;
      const v=Math.pow(Math.max(vals[i],0),0.52);
      const bh=Math.max(2.0, v*maxH); // minimum visible height
      // Bass bars slightly wider than treble, but always filling the slot
      const barW=slot*fill*(1.0+0.25*(1-i/N));
      const a0=ang-barW/2,a1=ang+barW/2;
      const ir=innerR, or_=innerR+bh;
      const ix0=cx+Math.cos(a0)*ir,iy0=cy+Math.sin(a0)*ir;
      const ix1=cx+Math.cos(a1)*ir,iy1=cy+Math.sin(a1)*ir;
      const ox0=cx+Math.cos(a0)*or_,oy0=cy+Math.sin(a0)*or_;
      const ox1=cx+Math.cos(a1)*or_,oy1=cy+Math.sin(a1)*or_;
      const br=0.12+v*0.2;
      verts[vi++]=ix0;verts[vi++]=iy0;brights[bi++]=br;
      verts[vi++]=ix1;verts[vi++]=iy1;brights[bi++]=br;
      verts[vi++]=ox0;verts[vi++]=oy0;brights[bi++]=v;
      verts[vi++]=ix1;verts[vi++]=iy1;brights[bi++]=br;
      verts[vi++]=ox1;verts[vi++]=oy1;brights[bi++]=v;
      verts[vi++]=ox0;verts[vi++]=oy0;brights[bi++]=v;
    }
    gl.useProgram(this._p);
    up(this._vb,verts);att(this._p,'a_p',2,8,0);
    up(this._bb,brights);att(this._p,'a_br',1,4,0);
    uM(this._p,'u_m',PROJ);
    const dc=DOM_COLOR;
    const sc=cfg.spectrum_color==='auto'?dc:hexRGB(cfg.spectrum_color||'#fff');
    u4f(this._p,'u_col',sc[0],sc[1],sc[2],cfg.spectrum_opacity||0.85);
    // Tips: complement/lighten
    u4f(this._p,'u_tip',
      Math.min(1,dc[0]*0.5+0.6),Math.min(1,dc[1]*0.5+0.6),Math.min(1,dc[2]*0.3+0.85),1.0);
    bAdd();gl.drawArrays(gl.TRIANGLES,0,N*6);bNorm();
  }
}

// ═══════════════════════════════════════════════════════════════════
//  CircleModule — spring anim + glass + inner shadow + aura + reflect
//  bass → scale  |  mid → glow  |  high → border shimmer
// ═══════════════════════════════════════════════════════════════════
class CircleModule {
  constructor(){
    this.scale=1;this.vel=0;this.breatheT=0;this.glowS=0;this.borderShimmer=0;
    this.logoTex=null;this.titleTex=null;
    // ── Floating motion state ──
    this.offX=0; this.offY=0;          // current displacement
    this.pushX=0; this.pushY=0;        // beat impulse (decays)
    this.pushVX=0; this.pushVY=0;      // impulse velocity (spring)
    this.floatT=Math.random()*100;     // desync phase
    const {buf:fb,n:fn}=fanBuf(256);this._fb=fb;this._fn=fn;
    const {buf:rb,n:rn}=ringBuf(512);this._rb=rb;this._rn=rn;
    this._logoBuf=gl.createBuffer();this._titleBuf=gl.createBuffer();
    // Glow / halo shader
    this._pGlow=mkProg(
      `#version 300 es
       in vec2 a_p;uniform vec2 u_cen;uniform float u_r;uniform mat3 u_m;
       out vec2 v_l;
       void main(){v_l=a_p;gl_Position=vec4((u_m*vec3(u_cen+a_p*u_r,1.)).xy,0.,1.);}`,
      `#version 300 es
       precision highp float;in vec2 v_l;uniform vec4 u_col;out vec4 o;
       void main(){float d=length(v_l);if(d>1.)discard;float g=pow(1.-d,3.)*u_col.a;o=vec4(u_col.rgb,g);}`);
    // Circle fill + glass shader
    this._pCircle=mkProg(
      `#version 300 es
       in vec2 a_p;uniform vec2 u_cen;uniform float u_r;uniform mat3 u_m;
       out vec2 v_l;
       void main(){v_l=a_p;gl_Position=vec4((u_m*vec3(u_cen+a_p*u_r,1.)).xy,0.,1.);}`,
      `#version 300 es
       precision highp float;in vec2 v_l;
       uniform vec4 u_fill,u_border;uniform float u_bfrac,u_glass,u_shimmer;
       out vec4 o;
       void main(){
         float d=length(v_l);if(d>1.)discard;
         // Inner shadow (dark at bottom, light at top)
         vec2 ln=normalize(v_l);
         float inner_sh=dot(ln,vec2(0.,-1.))*0.25*d; // shadow from bottom
         // Glass rim highlight
         float rim=pow(d,5.)*u_glass;
         // Border
         float bd=smoothstep(1.-u_bfrac-.015,1.-u_bfrac+.015,d);
         vec4 base=mix(vec4(u_fill.rgb*(1.+inner_sh*.3),u_fill.a),u_border,bd);
         // Top highlight (reflection)
         float hi=pow(max(0.,dot(ln,vec2(0.35,-0.93))),8.)*0.4*(1.-bd);
         base.rgb+=hi+rim*0.5+u_shimmer*0.3*bd;
         base.a=max(base.a,bd);
         o=base;
       }`);
    // Logo shader
    this._pLogo=mkProg(
      `#version 300 es
       in vec2 a_p,a_uv;uniform mat3 u_m;out vec2 v_uv;
       void main(){gl_Position=vec4((u_m*vec3(a_p,1.)).xy,0.,1.);v_uv=a_uv;}`,
      `#version 300 es
       precision highp float;in vec2 v_uv;uniform sampler2D u_t;uniform float u_al;
       out vec4 o;
       void main(){
         vec4 c=texture(u_t,v_uv);
         vec2 uv=v_uv-.5;float d=length(uv)*2.;
         c.a*=smoothstep(1.,.82,d)*u_al;o=c;
       }`);
  }
  async init(logoSrc,logoText,title,titleColor,titleFontSize){
    if(logoSrc){const r=await loadTex(logoSrc);if(r)this.logoTex=r;}
    if(!this.logoTex){
      const t=initialsTex(logoText||'♫',CFG.logo_font_size||80,CFG.logo_font_color||'#fff');
      this.logoTex={tex:t.tex,w:t.w,h:t.h};
    }
    if(title&&CFG.show_title){
      this.titleTex=textTex(title,titleFontSize||32,titleColor||'#fff','rgba(0,0,0,0.8)');
    }
  }
  update(dt){
    this.breatheT+=dt*1.6;
    this.floatT+=dt;
    // Bass drives circle scale (spring)
    const breathe=1+Math.sin(this.breatheT)*0.013;
    const target=breathe*(1+BANDS.bassSmooth*(CFG.circle_max_scale-1));
    const K=300,D=20;
    this.vel+=(target-this.scale)*K*dt-this.vel*D*dt;
    this.scale+=this.vel*dt;
    this.scale=Math.max(0.5,Math.min(this.scale,CFG.circle_max_scale*1.1));
    // Mid drives glow
    const tG=(CFG.circle_glow_intensity||1.2)*(0.3+BANDS.midSmooth*0.7);
    this.glowS+=(tG-this.glowS)*0.12;
    // High drives border shimmer
    this.borderShimmer+=(BANDS.highSmooth-this.borderShimmer)*0.20;

    // ── FLOATING MOTION ──────────────────────────────────────
    const R=(CFG.circle_radius||200);
    const floatAmp=(CFG.circle_float_amount||0.07)*R;   // continuous drift
    const pushAmp =(CFG.circle_push_amount ||0.15)*R;   // beat kick

    // Organic continuous float — 3 sines with different periods (Lissajous)
    const fx=Math.sin(this.floatT*0.53)*0.6+Math.sin(this.floatT*0.21)*0.4;
    const fy=Math.cos(this.floatT*0.41)*0.6+Math.cos(this.floatT*0.17)*0.4;
    const baseX=fx*floatAmp;
    const baseY=fy*floatAmp*0.75;

    // Beat impulse — random direction, weighted by bass energy
    if(BANDS.beat && BANDS.bassSmooth>0.15){
      const ang=Math.random()*Math.PI*2;
      const mag=pushAmp*Math.min(1,BANDS.bassSmooth*1.3);
      this.pushVX+=Math.cos(ang)*mag*11;
      this.pushVY+=Math.sin(ang)*mag*11;
    }
    // Spring back to center for the impulse component
    const PK=95,PD=9.5;
    this.pushVX+=(-this.pushX)*PK*dt-this.pushVX*PD*dt;
    this.pushVY+=(-this.pushY)*PK*dt-this.pushVY*PD*dt;
    this.pushX+=this.pushVX*dt;
    this.pushY+=this.pushVY*dt;
    // Clamp impulse so it never flies off
    const maxOff=pushAmp*1.5;
    const pm=Math.hypot(this.pushX,this.pushY);
    if(pm>maxOff){this.pushX*=maxOff/pm;this.pushY*=maxOff/pm;}

    // Final smoothed position
    this.offX+=((baseX+this.pushX)-this.offX)*0.14;
    this.offY+=((baseY+this.pushY)-this.offY)*0.14;
  }
  // Real center used by every module that orbits the circle
  center(cx,cy){return[cx+this.offX, cy+this.offY];}
  draw(cx,cy){
    const r=(CFG.circle_radius||200)*this.scale;
    const dc=DOM_COLOR;
    const gc=CFG.circle_glow_color==='auto'?dc:hexRGB(CFG.circle_glow_color||'#fff');

    // ── DROP SHADOW (detaches the circle from the background) ──
    // Offset opposite to the float direction → parallax illusion of depth
    if(CFG.circle_shadow!==false){
      const shOffX = -this.offX*0.35 + r*0.05;
      const shOffY = -this.offY*0.35 + r*0.11;
      gl.useProgram(this._pGlow);
      gl.bindBuffer(gl.ARRAY_BUFFER,this._fb);att(this._pGlow,'a_p',2,8,0);
      uM(this._pGlow,'u_m',PROJ);
      bNorm();
      for(let l=0;l<4;l++){
        u2f(this._pGlow,'u_cen',cx+shOffX,cy+shOffY);
        gl.uniform1f(gl.getUniformLocation(this._pGlow,'u_r'),r*(1.02+l*0.09));
        u4f(this._pGlow,'u_col',0,0,0,0.20-l*0.045);
        gl.drawArrays(gl.TRIANGLE_FAN,0,this._fn);
      }
    }

    // ── Close glow (2 layers, additive) ──
    gl.useProgram(this._pGlow);
    gl.bindBuffer(gl.ARRAY_BUFFER,this._fb);att(this._pGlow,'a_p',2,8,0);
    uM(this._pGlow,'u_m',PROJ);u2f(this._pGlow,'u_cen',cx,cy);
    bAdd();
    for(let l=0;l<3;l++){
      gl.uniform1f(gl.getUniformLocation(this._pGlow,'u_r'),r*(1.6+l*0.5));
      u4f(this._pGlow,'u_col',gc[0],gc[1],gc[2],this.glowS*(0.25-l*0.07));
      gl.drawArrays(gl.TRIANGLE_FAN,0,this._fn);
    }

    // ── Circle fill (glass) ──
    gl.useProgram(this._pCircle);
    gl.bindBuffer(gl.ARRAY_BUFFER,this._fb);att(this._pCircle,'a_p',2,8,0);
    uM(this._pCircle,'u_m',PROJ);u2f(this._pCircle,'u_cen',cx,cy);
    gl.uniform1f(gl.getUniformLocation(this._pCircle,'u_r'),r);
    const bg=hexRGBA(CFG.circle_bg_color||'#00000099');
    const bc=hexRGB(CFG.circle_border_color||'#fff');
    u4f(this._pCircle,'u_fill',bg[0],bg[1],bg[2],bg[3]);
    u4f(this._pCircle,'u_border',bc[0],bc[1],bc[2],1);
    gl.uniform1f(gl.getUniformLocation(this._pCircle,'u_bfrac'),(CFG.circle_border_width||5)/r);
    gl.uniform1f(gl.getUniformLocation(this._pCircle,'u_glass'),0.8+BANDS.rmsSmooth*0.4);
    gl.uniform1f(gl.getUniformLocation(this._pCircle,'u_shimmer'),this.borderShimmer);
    bNorm();gl.drawArrays(gl.TRIANGLE_FAN,0,this._fn);

    // ── Reflection arc (top ~55%, additive) ──
    gl.useProgram(this._pGlow); // reuse — simpler
    gl.bindBuffer(gl.ARRAY_BUFFER,this._rb);att(this._pGlow,'a_p',2,8,0);
    uM(this._pGlow,'u_m',PROJ);u2f(this._pGlow,'u_cen',cx,cy);
    gl.uniform1f(gl.getUniformLocation(this._pGlow,'u_r'),r+1.5);
    u4f(this._pGlow,'u_col',1,1,1,0.10+this.glowS*0.12);
    bAdd();gl.drawArrays(gl.LINE_STRIP,0,Math.floor(this._rn*0.55));

    // ── Logo / initials ──
    if(this.logoTex){
      gl.useProgram(this._pLogo);
      const lw=this.logoTex.w,lh=this.logoTex.h;
      const sc=Math.min(r*1.35/lw,r*1.35/lh);
      const dw=lw*sc,dh=lh*sc,dx=cx-dw/2,dy=cy-dh/2;
      const v=quadVerts(dx,dy,dw,dh);
      up(this._logoBuf,v);att(this._pLogo,'a_p',2,16,0);att(this._pLogo,'a_uv',2,16,8);
      uM(this._pLogo,'u_m',PROJ);u1i(this._pLogo,'u_t',0);
      gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,this.logoTex.tex);
      gl.uniform1f(gl.getUniformLocation(this._pLogo,'u_al'),1.0);
      bNorm();gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    }
    // ── Title ──
    if(this.titleTex){
      gl.useProgram(this._pLogo);
      const tt=this.titleTex,m=CFG.title_margin||56;
      const tx=(W-tt.w)/2;
      const ty=CFG.title_position==='top-center'?m:H-m-tt.h;
      const v=quadVerts(tx,ty,tt.w,tt.h);
      up(this._titleBuf,v);att(this._pLogo,'a_p',2,16,0);att(this._pLogo,'a_uv',2,16,8);
      uM(this._pLogo,'u_m',PROJ);u1i(this._pLogo,'u_t',0);
      gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tt.tex);
      gl.uniform1f(gl.getUniformLocation(this._pLogo,'u_al'),CFG.title_opacity||0.85);
      bNorm();gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    }
    bNorm();
  }
}
</script>

<script>
// ═══════════════════════════════════════════════════════════════════
//  ParticleSystem — 3 depth layers, born behind circle, frequency-driven
//  high → speed  |  bass → burst  |  presence → emission rate
// ═══════════════════════════════════════════════════════════════════
class ParticleSystem {
  constructor(){
    this._p=[];
    this._prog=mkProg(
      `#version 300 es
       in vec2 a_p;in float a_sz,a_al;uniform mat3 u_m;out float v_al;
       void main(){
         v_al=a_al;
         gl_Position=vec4((u_m*vec3(a_p,1.)).xy,0.,1.);
         gl_PointSize=a_sz;
       }`,
      `#version 300 es
       precision highp float;
       in float v_al;uniform vec4 u_col;out vec4 o;
       void main(){
         vec2 uv=gl_PointCoord-.5;float d=length(uv);if(d>.5)discard;
         float s=1.-smoothstep(.1,.5,d);
         o=vec4(u_col.rgb,s*v_al);
       }`);
    this._pb=gl.createBuffer();this._sb=gl.createBuffer();this._ab=gl.createBuffer();
    this._init();
  }
  _spawn(cx,cy,r,fromCircle){
    const cfg=CFG,depth=Math.random();
    const speed=(cfg.particle_speed||1)*(0.5+Math.random()*2.0)*(1.1-depth*.6);
    let x,y,vx,vy;
    if(fromCircle&&Math.random()<0.35){
      // Born from circle edge, ejected outward
      const ang=Math.random()*Math.PI*2;
      const br=r*(0.85+Math.random()*0.3);
      x=cx+Math.cos(ang)*br; y=cy+Math.sin(ang)*br;
      vx=Math.cos(ang)*speed*0.8; vy=Math.sin(ang)*speed*0.8-1.2*speed;
    } else {
      x=Math.random()*W; y=H*0.6+Math.random()*H*0.5;
      vx=(Math.random()-.5)*speed*1.5;
      vy=-(Math.random()*speed*1.2+0.4);
    }
    return{x,y,vx,vy,
      sz:((cfg.particle_size_min||1.5)+Math.random()*(( cfg.particle_size_max||5)-(cfg.particle_size_min||1.5)))*(1.8-depth),
      life:0.3+Math.random()*0.7,decay:0.003+Math.random()*0.008,depth};
  }
  _init(){
    const n=(CFG.particle_count||100)*4;
    for(let i=0;i<n;i++)this._p.push(this._spawn(W/2,H/2,200,false));
    // randomize initial life
    this._p.forEach(p=>{p.life=Math.random();});
  }
  update(dt,cx,cy,r){
    if(!CFG.particles_enabled)return;
    const b=BANDS;
    // High freq drives particle speed, bass drives burst on beat
    const boost=b.beat?1+b.bassSmooth*4.5:1+b.highSmooth*1.2;
    for(let i=0;i<this._p.length;i++){
      const p=this._p[i];
      p.x+=p.vx*boost; p.y+=p.vy*boost;
      p.vy-=0.014;   // subtle buoyancy
      p.life-=p.decay*(1+b.presSmooth*0.5);
      if(p.life<=0||p.y<-40||p.x<-40||p.x>W+40)
        this._p[i]=this._spawn(cx,cy,r,true);
    }
  }
  _layer(depthLo,depthHi,additive){
    if(!CFG.particles_enabled)return;
    const pts=this._p.filter(p=>p.depth>=depthLo&&p.depth<depthHi);
    if(!pts.length)return;
    const pa=new Float32Array(pts.length*2);
    const sa=new Float32Array(pts.length);
    const aa=new Float32Array(pts.length);
    for(let i=0;i<pts.length;i++){
      const p=pts[i];
      pa[i*2]=p.x;pa[i*2+1]=p.y;
      sa[i]=p.sz;
      aa[i]=Math.min(p.life,(CFG.particle_opacity_max||0.65))*(0.25+(1-p.depth)*0.75);
    }
    gl.useProgram(this._prog);
    up(this._pb,pa);att(this._prog,'a_p',2,8,0);
    up(this._sb,sa);att(this._prog,'a_sz',1,4,0);
    up(this._ab,aa);att(this._prog,'a_al',1,4,0);
    uM(this._prog,'u_m',PROJ);
    const dc=DOM_COLOR;
    const pc=CFG.particle_color==='auto'?dc:hexRGB(CFG.particle_color||'#fff');
    u4f(this._prog,'u_col',pc[0],pc[1],pc[2],1);
    if(additive)bAdd();else bNorm();
    gl.drawArrays(gl.POINTS,0,pts.length);
    bNorm();
  }
  drawBack(){this._layer(0.67,1.0,false);}
  drawMid(){this._layer(0.33,0.67,false);}
  drawFront(){this._layer(0.0,0.33,true);}
}

// ═══════════════════════════════════════════════════════════════════
//  LensFlare — bass beat driven, subtle starburst
// ═══════════════════════════════════════════════════════════════════
class LensFlare {
  constructor(){
    this.inten=0;
    this._p=mkProg(
      `#version 300 es
       in vec2 a_p;uniform mat3 u_m;void main(){gl_Position=vec4((u_m*vec3(a_p,1.)).xy,0.,1.);}`,
      `#version 300 es
       precision highp float;uniform vec4 u_col;out vec4 o;void main(){o=u_col;}`);
    this._buf=gl.createBuffer();
  }
  update(dt){
    if(BANDS.beat&&BANDS.bassSmooth>0.5)
      this.inten=Math.min(1,BANDS.bassSmooth*1.2);
    else this.inten*=0.78;
  }
  draw(cx,cy){
    if(!CFG.lens_flare||this.inten<0.015)return;
    const dc=DOM_COLOR,n=10,r=150*this.inten;
    const v=[];
    for(let i=0;i<n;i++){
      const a=i/n*Math.PI*2;
      v.push(cx,cy,cx+Math.cos(a)*r*0.12,cy+Math.sin(a)*r*0.12);
      v.push(cx+Math.cos(a)*r*0.12,cy+Math.sin(a)*r*0.12,
             cx+Math.cos(a)*r,cy+Math.sin(a)*r);
    }
    gl.useProgram(this._p);
    up(this._buf,new Float32Array(v));att(this._p,'a_p',2,8,0);
    uM(this._p,'u_m',PROJ);
    u4f(this._p,'u_col',dc[0]+.3,dc[1]+.3,dc[2]+.3,this.inten*0.25);
    bAdd();gl.drawArrays(gl.LINES,0,v.length/2);bNorm();
  }
}

// ═══════════════════════════════════════════════════════════════════
//  HUD (progress bar)
// ═══════════════════════════════════════════════════════════════════
class HUD {
  constructor(){
    this._p=mkProg(
      `#version 300 es
       in vec2 a_p;uniform mat3 u_m;void main(){gl_Position=vec4((u_m*vec3(a_p,1.)).xy,0.,1.);}`,
      `#version 300 es
       precision highp float;uniform vec4 u_col;out vec4 o;void main(){o=u_col;}`);
    this._buf=gl.createBuffer();
  }
  _rect(x,y,w,h,col){
    up(this._buf,new Float32Array([x,y,x+w,y,x,y+h,x+w,y+h]));
    att(this._p,'a_p',2,8,0);u4f(this._p,'u_col',...col);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  draw(progress){
    if(!CFG.progress_bar_enabled)return;
    const bh=CFG.progress_bar_height||4;
    const y=CFG.progress_bar_position==='top'?0:H-bh;
    const bw=W*Math.max(0,Math.min(1,progress));
    const dc=DOM_COLOR;
    gl.useProgram(this._p);uM(this._p,'u_m',PROJ);
    bNorm();this._rect(0,y,W,bh,[0,0,0,0.4]);
    if(bw>0){bAdd();this._rect(0,y,bw,bh,[dc[0],dc[1],dc[2],0.9]);}
    bNorm();
  }
}
</script>

<script>
// ═══════════════════════════════════════════════════════════════════
//  MAIN — initVisualizer + renderFrame
// ═══════════════════════════════════════════════════════════════════
window.initVisualizer = async function({bgImage,logoImage,cfg,title,totalFrames}){
  CFG=cfg; W=cfg.width||1920; H=cfg.height||1080; FPS=cfg.fps||30;
  canvas.width=W; canvas.height=H;
  gl.viewport(0,0,W,H);
  gl.enable(gl.BLEND); bNorm();
  PROJ=ortho(W,H); T=0;

  DOM_COLOR = await extractDomColor(bgImage);

  mBG       = new BackgroundModule();
  mHalo     = new HaloModule();
  mWaves    = new WaveRings();
  mSpectrum = new AudioSpectrum();
  mParticles= new ParticleSystem();
  mCircle   = new CircleModule();
  mLens     = new LensFlare();
  mHUD      = new HUD();

  await mBG.init(bgImage);
  await mCircle.init(logoImage, cfg.logo_text||'♫', title,
                     cfg.title_color||'#fff', cfg.title_font_size||32);
};

// Advance simulation state WITHOUT drawing — used to fast-forward a parallel
// worker page to the first frame of its chunk. Runs entirely inside JS so it
// costs a single CDP round-trip instead of one per frame.
window.fastForwardTo = function(allFrames, targetIndex){
  for(let i=0;i<targetIndex && i<allFrames.length;i++){
    window.renderFrame(allFrames[i], true);
  }
};

window.renderFrame = function(fd, skipDraw){
  const {frameIndex,totalFrames,rms,spectrum,isBeat,beatStrength,progress,
         bass,mid,high,presence}=fd;
  const dt=1/FPS; T+=dt;
  const cx=W/2, cy=H/2;

  // ── Band separation ──────────────────────────────────────────
  // Bands are pre-computed in Python (light payload). Fallback: derive
  // them from the raw spectrum if not provided.
  if(bass!==undefined){
    BANDS.bass=bass; BANDS.mid=mid; BANDS.high=high; BANDS.presence=presence;
  } else if(spectrum&&spectrum.length){
    BANDS.bass     = bandEnergy(spectrum, 0.00, 0.10);
    BANDS.mid      = bandEnergy(spectrum, 0.10, 0.42);
    BANDS.high     = bandEnergy(spectrum, 0.42, 0.78);
    BANDS.presence = bandEnergy(spectrum, 0.78, 1.00);
  }
  BANDS.rms=rms; BANDS.beat=isBeat; BANDS.beatStr=beatStrength||0;
  // Smoothed values (each band independent decay rate)
  BANDS.bassSmooth  +=(BANDS.bass      -BANDS.bassSmooth  )*0.22;
  BANDS.midSmooth   +=(BANDS.mid       -BANDS.midSmooth   )*0.18;
  BANDS.highSmooth  +=(BANDS.high      -BANDS.highSmooth  )*0.28;
  BANDS.presSmooth  +=(BANDS.presence  -BANDS.presSmooth  )*0.30;
  BANDS.rmsSmooth   +=(BANDS.rms       -BANDS.rmsSmooth   )*0.20;

  // ── Module updates (circle first — others follow its center) ──
  mCircle.update(dt);
  const [ccx,ccy]=mCircle.center(cx,cy);   // dynamic floating center
  const circleR=(CFG.circle_radius||200)*mCircle.scale;

  mBG.update(dt);
  mHalo.update(dt);
  if(isBeat) mWaves.onBeat();
  mWaves.update(dt);
  mParticles.update(dt, ccx, ccy, circleR);
  mLens.update(dt);

  // Fast-forward mode: state advanced, nothing rendered
  if(skipDraw) return;

  // ══ DRAW ORDER ════════════════════════════════════════════════
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  // Layer 1 — Background (always moving)
  mBG.draw();

  // Layer 2 — Back particles (far, small, normal blend)
  mParticles.drawBack();

  // Layer 3 — Halo (diffuse light behind circle, additive)
  mHalo.draw(ccx,ccy);

  // Layer 4 — Wave rings (mid-driven, additive)
  mWaves.draw(ccx, ccy, circleR);

  // Layer 5 — Audio spectrum (radial bars, additive)
  if(CFG.spectrum_enabled) mSpectrum.draw(ccx, ccy, circleR, spectrum);

  // Layer 6 — Mid particles
  mParticles.drawMid();

  // Layer 7 — Circle (glass + spring + glow + shadow)
  mCircle.draw(ccx,ccy);

  // Layer 8 — Lens flare (beat driven, additive)
  if(CFG.lens_flare) mLens.draw(ccx,ccy);

  // Layer 9 — Front particles (near, large, additive)
  mParticles.drawFront();

  // Layer 10 — HUD (progress bar)
  mHUD.draw(progress);
};
</script>
